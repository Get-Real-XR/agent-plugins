[package]
name = "jj-stale-descriptions"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Staleness detection hooks for jj change descriptions in Claude Code"
publish = false

[[bin]]
name = "jj-stale-descriptions"
path = "src/main.rs"

[dependencies]
anyhow = "1"
futures = "0.3.32"
jj-lib = { version = "0.45.1", features = ["git"] }
pollster = "0.4.0"
sha2 = "0.11.0"
tempfile = "3.26.0"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

[lints.rust]
unsafe_code = "deny"
